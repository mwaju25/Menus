<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Affichage Dynamique École</title>
    <link href="https://googleapis.com" rel="stylesheet">
    
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        
        body {
            font-family: 'Inter', sans-serif;
            width: 1920px;
            height: 1080px;
            overflow: hidden;
            background-color: #000000;
            background-size: cover;
            background-position: center;
            display: flex;
            padding: 60px;
            justify-content: space-between;
            align-items: center;
        }

        /* --- MOITIÉ GAUCHE : HORLOGE ANALOGIQUE --- */
        .left-side {
            width: 850px;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .analog-clock {
            width: 580px;
            height: 580px;
            border: 18px solid #ffffff;
            border-radius: 50%;
            position: relative;
            background: #111b29; /* Bleu foncé opaque pour un fort contraste */
            box-shadow: 0 30px 60px rgba(0,0,0,0.8), inset 0 0 40px rgba(0,0,0,0.6);
        }
        /* Point central de l'horloge */
        .analog-clock::after {
            content: '';
            position: absolute;
            width: 24px;
            height: 24px;
            background: #ff9f43;
            border-radius: 50%;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 10;
        }
        /* Construction des repères des heures */
        .hour-marker {
            position: absolute;
            width: 8px;
            height: 25px;
            background: #ffffff;
            left: 50%;
            margin-left: -4px;
            transform-origin: bottom center;
            bottom: 50%;
        }
        /* Aiguilles */
        .hand {
            position: absolute;
            bottom: 50%;
            left: 50%;
            transform-origin: bottom center;
            border-radius: 10px;
            transform: rotate(0deg);
        }
        .hour-hand {
            width: 14px;
            height: 150px;
            background: #ffffff;
            z-index: 5;
            margin-left: -7px;
        }
        .minute-hand {
            width: 9px;
            height: 220px;
            background: #ffffff;
            z-index: 6;
            margin-left: -4.5px;
        }
        .second-hand {
            width: 4px;
            height: 245px;
            background: #ff9f43;
            z-index: 7;
            margin-left: -2px;
            border-radius: 0;
        }

        /* --- MOITIÉ DROITE : DATE ET ARDOISE --- */
        .right-side {
            width: 850px;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }
        /* Encadré de la Date */
        .date-container {
            width: 100%;
            background: #111b29; /* Assorti au bleu de l'horloge */
            border-radius: 24px;
            padding: 30px;
            text-align: center;
            border: 2px solid rgba(255, 255, 255, 0.15);
            box-shadow: 0 20px 40px rgba(0,0,0,0.6);
        }
        .date-text {
            font-size: 42px;
            font-weight: 900;
            color: #00ffcc;
            text-transform: capitalize;
            letter-spacing: 1px;
            text-shadow: 2px 2px 8px rgba(0,0,0,0.5);
        }
        /* Cadre Ardoise du Restaurant */
        .slate-container {
            width: 100%;
            height: 720px;
            background: #1e1e1e; 
            border: 22px solid #5c4033; /* Cadre en bois */
            border-radius: 16px;
            box-shadow: 0 30px 60px rgba(0,0,0,0.8), inset 0 0 40px rgba(0,0,0,1);
            padding: 15px;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }
        .menu-photo {
            width: 100%;
            height: 100%;
            object-fit: contain; 
            border-radius: 4px;
        }
    </style>
</head>
<body>

    <!-- 1. CÔTÉ GAUCHE : HORLOGE ANALOGIQUE COMPLET -->
    <div class="left-side">
        <div class="analog-clock" id="clock-face">
            <!-- Les repères des heures vont être générés ici par le script -->
            <div class="hand hour-hand" id="hour"></div>
            <div class="hand minute-hand" id="minute"></div>
            <div class="hand second-hand" id="second"></div>
        </div>
    </div>

    <!-- 2. CÔTÉ DROIT : DATE + ARDOISE MENU -->
    <div class="right-side">
        <div class="date-container">
            <div class="date-text" id="date">Chargement...</div>
        </div>
        
        <div class="slate-container">
            <img src="" id="menu-image" class="menu-photo" alt="Chargement du menu...">
        </div>
    </div>

    <script>
        // Génération automatique des 12 repères des heures autour du cadran
        const clockFace = document.getElementById('clock-face');
        for (let i = 1; i <= 12; i++) {
            const marker = document.createElement('div');
            marker.className = 'hour-marker';
            // Calcul de la hauteur pour décoller le repère du centre et le coller au bord
            marker.style.transform = `rotate(${i * 30}deg) translateY(-245px)`;
            clockFace.appendChild(marker);
        }

        // CONFIGURATION DES IMAGES PAR JOUR DE LA SEMAINE
        const configSemaine = {
            1: { gif: "lundi.gif", photo: "menu-lundi.jpg" },
            2: { gif: "mardi.gif", photo: "menu-mardi.jpg" },
            3: { gif: "mercredi.gif", photo: "menu-mercredi.jpg" },
            4: { gif: "jeudi.gif", photo: "menu-jeudi.jpg" },
            5: { gif: "vendredi.gif", photo: "menu-vendredi.jpg" }
        };

        const configWeekend = { gif: "weekend.gif", photo: "menu-ferme.jpg" };

        function updateScreen() {
            const now = new Date();
            const dayOfWeek = now.getDay();
            
            // --- 1. ROTATION DES AIGUILLES ---
            const seconds = now.getSeconds();
            const minutes = now.getMinutes();
            const hours = now.getHours();

            const secondDegrees = (seconds / 60) * 360;
            const minuteDegrees = (minutes / 60) * 360 + (seconds / 60) * 6;
            const hourDegrees = (hours / 12) * 360 + (minutes / 60) * 30;

            document.getElementById('second').style.transform = `rotate(${secondDegrees}deg)`;
            document.getElementById('minute').style.transform = `rotate(${minuteDegrees}deg)`;
            document.getElementById('hour').style.transform = `rotate(${hourDegrees}deg)`;

            // --- 2. DATE COMPLÈTE ---
            const options = { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' };
            document.getElementById('date').textContent = now.toLocaleDateString('fr-FR', options);
            
            // --- 3. CHARGEMENT DES MEDIAS ---
            const dataJourdhui = configSemaine[dayOfWeek] || configWeekend;
            document.body.style.backgroundImage = `url('${dataJourdhui.gif}')`;
            document.getElementById('menu-image').src = dataJourdhui.photo;
        }

        updateScreen();
        setInterval(updateScreen, 1000);
    </script>
</body>
</html>
