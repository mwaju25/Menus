<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Affichage Dynamique École</title>
    <link href="https://googleapis.com" rel="stylesheet">
    
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        
        body {
            font-family: 'Inter', sans-serif;
            width: 1920px;
            height: 1080px;
            overflow: hidden;
            background-color: #000000;
            background-image: url('fond.gif'); /* Doit s'appeler fond.gif sur GitHub */
            background-size: cover;
            background-position: center;
            display: flex;
            padding: 50px 80px;
            justify-content: space-between;
            align-items: flex-end; /* Aligne les éléments vers le bas pour laisser de la place au titre du GIF */
        }

        /* --- MOITIÉ GAUCHE : HORLOGE ANALOGIQUE (PLUS PETITE) --- */
        .left-side {
            width: 750px;
            height: 700px;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .analog-clock {
            width: 420px; /* Réduit de 580px à 420px */
            height: 420px;
            border: 12px solid #ffffff;
            border-radius: 50%;
            position: relative;
            background: #111b29;
            box-shadow: 0 20px 40px rgba(0,0,0,0.8), inset 0 0 30px rgba(0,0,0,0.6);
        }
        .analog-clock::after {
            content: '';
            position: absolute;
            width: 18px;
            height: 18px;
            background: #ff9f43;
            border-radius: 50%;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 10;
        }
        .hour-marker {
            position: absolute;
            width: 6px;
            height: 18px;
            background: #ffffff;
            left: 50%;
            margin-left: -3px;
            transform-origin: bottom center;
            bottom: 50%;
        }
        .hand {
            position: absolute;
            bottom: 50%;
            left: 50%;
            transform-origin: bottom center;
            border-radius: 8px;
        }
        .hour-hand {
            width: 10px;
            height: 110px;
            background: #ffffff;
            z-index: 5;
            margin-left: -5px;
        }
        .minute-hand {
            width: 7px;
            height: 160px;
            background: #ffffff;
            z-index: 6;
            margin-left: -3.5px;
        }
        .second-hand {
            width: 3px;
            height: 180px;
            background: #ff9f43;
            z-index: 7;
            margin-left: -1.5px;
        }

        /* --- MOITIÉ DROITE : DATE ET ARDOISE (PROPORTIONNÉES) --- */
        .right-side {
            width: 750px;
            height: 750px; /* Réduit pour éviter d'envahir le haut de l'écran */
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }
        .date-container {
            width: 100%;
            background: #111b29;
            border-radius: 20px;
            padding: 20px;
            text-align: center;
            border: 2px solid rgba(255, 255, 255, 0.15);
            box-shadow: 0 15px 30px rgba(0,0,0,0.6);
        }
        .date-text {
            font-size: 34px; /* Un peu plus petit et discret */
            font-weight: 900;
            color: #00ffcc;
            text-transform: capitalize;
        }
        .slate-container {
            width: 100%;
            height: 580px; /* Ajusté pour laisser de la place */
            background: #1e1e1e; 
            border: 18px solid #5c4033; /* Cadre bois légèrement plus fin */
            border-radius: 14px;
            box-shadow: 0 25px 45px rgba(0,0,0,0.8), inset 0 0 30px rgba(0,0,0,1);
            padding: 10px;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }
        .menu-photo {
            width: 100%;
            height: 100%;
            object-fit: contain; 
            border-radius: 4px;
        }
    </style>
</head>
<body>

    <!-- GAUCHE -->
    <div class="left-side">
        <div class="analog-clock" id="clock-face">
            <div class="hand hour-hand" id="hour"></div>
            <div class="hand minute-hand" id="minute"></div>
            <div class="hand second-hand" id="second"></div>
        </div>
    </div>

    <!-- DROITE -->
    <div class="right-side">
        <div class="date-container">
            <div class="date-text" id="date">Chargement...</div>
        </div>
        <div class="slate-container">
            <img src="" id="menu-image" class="menu-photo" alt="Chargement du menu...">
        </div>
    </div>

    <script>
        // Génération dynamique des 12 repères (adaptée à la nouvelle taille de 420px)
        const clockFace = document.getElementById('clock-face');
        for (let i = 1; i <= 12; i++) {
            const marker = document.createElement('div');
            marker.className = 'hour-marker';
            marker.style.transform = `rotate(${i * 30}deg) translateY(-172px)`;
            clockFace.appendChild(marker);
        }

        const photosSemaine = {
            1: "menu-lundi.jpg",
            2: "menu-mardi.jpg",
            3: "menu-mercredi.jpg",
            4: "menu-jeudi.jpg",
            5: "menu-vendredi.jpg"
        };
        const photoWeekend = "menu-ferme.jpg";

        function updateScreen() {
            const now = new Date();
            const dayOfWeek = now.getDay();
            
            // 1. Horloge analogique
            const seconds = now.getSeconds();
            const minutes = now.getMinutes();
            const hours = now.getHours();

            const secondDegrees = (seconds / 60) * 360;
            const minuteDegrees = (minutes / 60) * 360 + (seconds / 60) * 6;
            const hourDegrees = (hours / 12) * 360 + (minutes / 60) * 30;

            document.getElementById('second').style.transform = `rotate(${secondDegrees}deg)`;
            document.getElementById('minute').style.transform = `rotate(${minuteDegrees}deg)`;
            document.getElementById('hour').style.transform = `rotate(${hourDegrees}deg)`;

            // 2. Date complète
            const options = { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' };
            document.getElementById('date').textContent = now.toLocaleDateString('fr-FR', options);
            
            // 3. Photo du menu
            const photoAujourdhui = photosSemaine[dayOfWeek] || photoWeekend;
            document.getElementById('menu-image').src = photoAujourdhui;
        }

        updateScreen();
        setInterval(updateScreen, 1000);
    </script>
</body>
</html>
