<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Affichage Dynamique École</title>
    <link href="https://googleapis.com" rel="stylesheet">
    
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        
        body {
            font-family: 'Inter', sans-serif;
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            background-color: #000000;
            background-image: url('menu.gif'); 
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            display: flex;
            padding: 4vh 6vw;
            justify-content: space-between;
            align-items: flex-end; 
        }

        /* --- CONTENEURS ÉQUILIBRÉS GAUCHE / DROITE (42% CHACUN) --- */
        .left-side {
            width: 42%;
            height: 62vh; 
            display: flex;
            justify-content: center;
            align-items: center;
        }
        
        .right-side {
            width: 42%;
            height: 62vh; 
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        /* --- GAUCHE : HORLOGE ENGRENAGES AUTOMATIQUE --- */
        .analog-clock {
            width: 360px; 
            height: 360px;
            border: 6px solid rgba(255, 255, 255, 0.7);
            border-radius: 50%;
            position: relative;
            background: rgba(10, 25, 47, 0.4); 
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            box-shadow: 0 30px 60px rgba(0,0,0,0.6), inset 0 0 30px rgba(255,255,255,0.05);
            overflow: hidden;
        }

        /* Engrenages décoratifs synchronisés */
        .gear-container {
            position: absolute;
            width: 100%;
            height: 100%;
            top: 0;
            left: 0;
            opacity: 0.25; 
            z-index: 1;
        }
        .gear-main {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 160px;
            height: 160px;
            margin-top: -80px;
            margin-left: -80px;
            border: 6px dashed #ffffff;
            border-radius: 50%;
            animation: rotateGear 40s linear infinite;
        }
        .gear-second {
            position: absolute;
            top: 38%;
            left: 38%;
            width: 90px;
            height: 90px;
            border: 4px dashed #ff9f43;
            border-radius: 50%;
            animation: rotateGearRev 20s linear infinite;
        }
        @keyframes rotateGear { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
        @keyframes rotateGearRev { from { transform: rotate(0deg); } to { transform: rotate(-360deg); } }

        /* Cadran et repères */
        .clock-face-lines {
            position: absolute;
            width: 100%;
            height: 100%;
            z-index: 2;
        }
        .analog-clock::after {
            content: '';
            position: absolute;
            width: 14px;
            height: 14px;
            background: #ff9f43;
            border-radius: 50%;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 10;
        }
        .hour-marker {
            position: absolute;
            width: 4px;
            height: 16px;
            background: #ffffff;
            left: 50%;
            margin-left: -2px;
            transform-origin: bottom center;
            bottom: 50%;
        }
        
        /* Aiguilles dynamiques */
        .hand {
            position: absolute;
            bottom: 50%;
            left: 50%;
            transform-origin: bottom center;
            border-radius: 4px 4px 0 0;
            transition: transform 0.2s cubic-bezier(0.4, 2.08, 0.55, 1.4); /* Effet mécanique fluide */
        }
        .hour-hand {
            width: 8px;
            height: 90px;
            background: #ffffff;
            z-index: 5;
            margin-left: -4px;
        }
        .minute-hand {
            width: 5px;
            height: 135px;
            background: #ffffff;
            z-index: 6;
            margin-left: -2.5px;
        }
        .second-hand {
            width: 2px;
            height: 150px;
            background: #ff9f43;
            z-index: 7;
            margin-left: -1px;
            border-radius: 0;
            transition: none; /* Pas de transition pour la trotteuse pour un tic-tac net */
        }

        /* --- DROITE : CADRE DATE ET ARDOISE --- */
        .date-container {
            width: 100%;
            background: rgba(14, 23, 37, 0.5);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 14px;
            text-align: center;
            border: 1px solid rgba(255, 255, 255, 0.12);
            box-shadow: 0 15px 35px rgba(0,0,0,0.4);
        }
        .date-text {
            font-family: 'Playfair Display', serif;
            font-size: 26px; 
            font-style: italic;
            color: #ffffff;
        }
        .slate-container {
            width: 100%;
            height: 78%; 
            background-color: #22252a;
            background-image: radial-gradient(rgba(255,255,255,0.02) 1px, transparent 0);
            background-size: 4px 4px;
            border: 16px solid #4a3329; 
            border-radius: 8px;
            outline: 2px solid #2e1f18;
            box-shadow: 0 25px 50px rgba(0,0,0,0.7), inset 0 0 30px rgba(0,0,0,0.9);
            padding: 10px;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }
        .menu-photo {
            width: 100%;
            height: 100%;
            object-fit: contain; 
        }
    </style>
</head>
<body>

    <!-- GAUCHE : HORLOGE INTERNE DYNAMIQUE -->
    <div class="left-side">
        <div class="analog-clock">
            <div class="gear-container">
                <div class="gear-main"></div>
                <div class="gear-second"></div>
            </div>
            <div class="clock-face-lines" id="clock-face">
                <div class="hand hour-hand" id="hour"></div>
                <div class="hand minute-hand" id="minute"></div>
                <div class="hand second-hand" id="second"></div>
            </div>
        </div>
    </div>

    <!-- DROITE : DATE ET ARDOISE MISES À JOUR À MINUIT -->
    <div class="right-side">
        <div class="date-container">
            <div class="date-text" id="date">Chargement...</div>
        </div>
        <div class="slate-container">
            <img src="" id="menu-image" class="menu-photo" alt="Menu du jour">
        </div>
    </div>

    <script>
        // Génération automatique des repères
        const clockFace = document.getElementById('clock-face');
        for (let i = 1; i <= 12; i++) {
            const marker = document.createElement('div');
            marker.className = 'hour-marker';
            marker.style.transform = `rotate(${i * 30}deg) translateY(-160px)`;
            clockFace.appendChild(marker);
        }

        // Dictionnaire des photos lues automatiquement selon le jour
        const photosSemaine = {
            1: "menu-lundi.jpg",
            2: "menu-mardi.jpg",
            3: "menu-mercredi.jpg",
            4: "menu-jeudi.jpg",
            5: "menu-vendredi.jpg"
        };
        const photoWeekend = "menu-ferme.jpg";

        function updateScreen() {
            const now = new Date();
            const dayOfWeek = now.getDay(); // 1 = Lundi, 2 = Mardi...
            
            // 1. Calcul précis et mise à l'heure des aiguilles
            const seconds = now.getSeconds();
            const minutes = now.getMinutes();
            const hours = now.getHours();

            const secondDegrees = (seconds / 60) * 360;
            const minuteDegrees = (minutes / 60) * 360 + (seconds / 60) * 6;
            const hourDegrees = (hours / 12) * 360 + (minutes / 60) * 30;

            document.getElementById('second').style.transform = `rotate(${secondDegrees}deg)`;
            document.getElementById('minute').style.transform = `rotate(${minuteDegrees}deg)`;
            document.getElementById('hour').style.transform = `rotate(${hourDegrees}deg)`;

            // 2. Changement de la date textuelle automatique
            const options = { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' };
            document.getElementById('date').textContent = now.toLocaleDateString('fr-FR', options);
            
            // 3. Basculement automatique de l'image du menu du jour
            const photoAujourdhui = photosSemaine[dayOfWeek] || photoWeekend;
            
            // Sécurité : On ne recharge l'image que si le nom change pour éviter les clignotements d'écran
            const imgElement = document.getElementById('menu-image');
            if (!imgElement.src.includes(photoAujourdhui)) {
                imgElement.src = photoAujourdhui;
            }
        }

        // Lancement immédiat au démarrage de l'écran
        updateScreen();
        
        // Rafraîchissement constant à la milliseconde pour l'heure
        setInterval(updateScreen, 1000);
    </script>
</body>
</html>
