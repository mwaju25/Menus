<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Affichage École</title>
    <link href="https://googleapis.com" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Inter', sans-serif; width: 100vw; height: 100vh; overflow: hidden;
            background: #000 url('menu.gif') center/cover no-repeat;
            display: flex; padding: 4vh 6vw; justify-content: space-between; align-items: flex-end; 
        }
        
        .left-side, .right-side { width: 44%; height: 580px; display: flex; }
        .left-side { justify-content: center; align-items: center; }
        .right-side { flex-direction: column; justify-content: space-between; }

        /* --- HORLOGE GÉANTE CLASSIQUE BLANCHE (580px) --- */
        .analog-clock {
            width: 580px; height: 580px; border: 12px solid #1a1a1a; border-radius: 50%;
            position: relative; background: #ffffff; overflow: hidden;
            box-shadow: 0 30px 60px rgba(0,0,0,0.6), inset 0 0 25px rgba(0,0,0,0.15);
        }
        .clock-face-lines { position: absolute; width: 100%; height: 100%; z-index: 3; }
        .analog-clock::after {
            content: ''; position: absolute; width: 22px; height: 22px; background: #1a1a1a;
            border-radius: 50%; top: 50%; left: 50%; transform: translate(-50%, -50%); z-index: 10;
        }
        .clock-number {
            position: absolute; font-size: 52px; font-weight: 900; color: #1a1a1a; 
            width: 70px; height: 70px; text-align: center; line-height: 70px;
        }
        .hour-marker {
            position: absolute; left: 50%; transform-origin: bottom center; bottom: 50%;
        }
        .hand { position: absolute; bottom: 50%; left: 50%; transform-origin: bottom center; border-radius: 6px 6px 0 0; }
        .hour-hand { width: 16px; height: 150px; background: #1a1a1a; z-index: 5; margin-left: -8px; }
        .minute-hand { width: 10px; height: 220px; background: #1a1a1a; z-index: 6; margin-left: -5px; }
        .second-hand { width: 3px; height: 250px; background: #e74c3c; z-index: 7; margin-left: -1.5px; border-radius: 0; }

        /* --- BLOC DATE DU HAUT AVEC CADRE JAUNE/DORÉ --- */
        .date-container {
            width: 100%; background: rgba(17, 17, 17, 0.95); border-radius: 20px;
            padding: 20px; text-align: center; border: 3px solid #d4af37; box-shadow: 0 15px 35px rgba(0,0,0,0.5);
        }
        .date-text { font-size: 34px; font-weight: 900; color: #ffffff; text-transform: uppercase; letter-spacing: 2px; }
        
        /* --- ARDOISE TRADITIONNELLE AVEC CADRE EN BOIS --- */
        .slate-container {
            width: 100%; height: 465px; background: #22252a; 
            border: 18px solid #4a3329; border-radius: 10px; 
            outline: 2px solid #2e1f18;
            box-shadow: 0 20px 45px rgba(0,0,0,0.6), inset 0 0 30px rgba(0,0,0,0.8);
            padding: 10px; display: flex; justify-content: center; align-items: center; overflow: hidden;
        }
        .menu-photo { width: 100%; height: 100%; object-fit: contain; }
    </style>
</head>
<body>

    <!-- GAUCHE : HORLOGE XXL TRÈS LISIBLE -->
    <div class="left-side">
        <div class="analog-clock">
            <div class="clock-face-lines" id="clock-face">
                <div class="hand hour-hand" id="hour"></div>
                <div class="hand minute-hand" id="minute"></div>
                <div class="hand second-hand" id="second"></div>
            </div>
        </div>
    </div>

    <!-- DROITE : CADRE DORÉ ET ARDOISE BOIS -->
    <div class="right-side">
        <div class="date-container"><div class="date-text" id="date">Chargement...</div></div>
        <div class="slate-container"><img src="" id="menu-image" class="menu-photo" alt="Menu"></div>
    </div>

    <!-- SCRIPT INTELLIGENT DE ROTATION ET GRADUATION -->
    <script>
        const clockFace = document.getElementById('clock-face');
        const radius = 205; 
        
        // 1. Placement des chiffres 1 à 12
        for (let i = 1; i <= 12; i++) {
            const num = document.createElement('div');
            num.className = 'clock-number'; num.textContent = i;
            const angle = (i * 30 - 90) * (Math.PI / 180);
            const x = 290 + radius * Math.cos(angle) - 35; 
            const y = 290 + radius * Math.sin(angle) - 35;
            num.style.left = x + 'px';
            num.style.top = y + 'px';
            clockFace.appendChild(num);
        }
        
        // 2. Génération complète de TOUTES les 60 graduations
        for (let i = 1; i <= 60; i++) {
            const m = document.createElement('div'); 
            m.className = 'hour-marker';
            if (i % 5 === 0) {
                m.style.width = '6px';
                m.style.height = '22px';
                m.style.background = '#1a1a1a';
                m.style.marginBtm = '-11px';
                m.style.marginLeft = '-3px';
                m.style.transform = 'rotate(' + (i * 6) + 'deg) translateY(-254px)';
            } else {
                m.style.width = '3px';
                m.style.height = '12px';
                m.style.background = '#666666';
                m.style.marginBtm = '-6px';
                m.style.marginLeft = '-1.5px';
                m.style.transform = 'rotate(' + (i * 6) + 'deg) translateY(-258px)';
            }
            clockFace.appendChild(m);
        }

        const photosSemaine = { 1: "menu-lundi.jpg", 2: "menu-mardi.jpg", 3: "menu-mercredi.jpg", 4: "menu-jeudi.jpg", 5: "menu-vendredi.jpg" };

        function update() {
            const now = new Date();
            document.getElementById('second').style.transform = 'rotate(' + ((now.getSeconds() / 60) * 360) + 'deg)';
            document.getElementById('minute').style.transform = 'rotate(' + ((now.getMinutes() / 60) * 360 + (now.getSeconds() / 60) * 6) + 'deg)';
            document.getElementById('hour').style.transform = 'rotate(' + ((now.getHours() / 12) * 360 + (now.getMinutes() / 60) * 30) + 'deg)';
            document.getElementById('date').textContent = now.toLocaleDateString('fr-FR', { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' });
            
            const photo = photosSemaine[now.getDay()] || "menu-ferme.jpg";
            if (!document.getElementById('menu-image').src.includes(photo)) document.getElementById('menu-image').src = photo;
        }
        update(); setInterval(update, 1000);
    </script>
</body>
</html>
