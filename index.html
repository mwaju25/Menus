<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Affichage Dynamique École</title>
    <!-- Importation de polices élégantes : Inter pour l'horloge, Playfair pour le côté restaurant -->
    <link href="https://googleapis.com" rel="stylesheet">
    
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        
        body {
            font-family: 'Inter', sans-serif;
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            background-color: #000000;
            background-image: url('menu.gif'); 
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            display: flex;
            padding: 4vh 5vw;
            justify-content: space-between;
            align-items: flex-end; 
        }

        /* --- MOITIÉ GAUCHE : HORLOGE DESIGN --- */
        .left-side {
            width: 45%;
            height: 65vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .analog-clock {
            width: 340px; 
            height: 340px;
            border: 4px solid rgba(255, 255, 255, 0.8);
            border-radius: 50%;
            position: relative;
            /* Effet Frosted Glass (verre dépoli) pour laisser deviner le fond bleu sans bloquer le regard */
            background: rgba(255, 255, 255, 0.08); 
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            box-shadow: 0 20px 50px rgba(0,0,0,0.4), inset 0 0 20px rgba(255,255,255,0.1);
        }
        /* Cœur de l'horloge */
        .analog-clock::after {
            content: '';
            position: absolute;
            width: 12px;
            height: 12px;
            background: #ff9f43;
            border-radius: 50%;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 10;
        }
        /* Index des heures épurés */
        .hour-marker {
            position: absolute;
            width: 3px;
            height: 14px;
            background: rgba(255, 255, 255, 0.6);
            left: 50%;
            margin-left: -1.5px;
            transform-origin: bottom center;
            bottom: 50%;
        }
        /* Style des aiguilles profilées */
        .hand {
            position: absolute;
            bottom: 50%;
            left: 50%;
            transform-origin: bottom center;
        }
        .hour-hand {
            width: 8px;
            height: 85px;
            background: #ffffff;
            border-radius: 4px;
            z-index: 5;
            margin-left: -4px;
        }
        .minute-hand {
            width: 4px;
            height: 125px;
            background: rgba(255, 255, 255, 0.85);
            border-radius: 4px;
            z-index: 6;
            margin-left: -2px;
        }
        .second-hand {
            width: 2px;
            height: 140px;
            background: #ff9f43;
            z-index: 7;
            margin-left: -1px;
        }

        /* --- MOITIÉ DROITE : DATE ET ARDOISE RESTAURANT --- */
        .right-side {
            width: 45%;
            height: 68vh; 
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }
        /* Encadré Date Stylisé */
        .date-container {
            width: 100%;
            background: rgba(14, 23, 37, 0.6);
            backdrop-filter: blur(10px);
            border-radius: 30px;
            padding: 12px 25px;
            text-align: center;
            border: 1px solid rgba(255, 255, 255, 0.15);
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
        }
        .date-text {
            font-family: 'Playfair Display', serif;
            font-size: 28px; 
            font-style: italic;
            font-weight: 400;
            color: #ffffff;
            letter-spacing: 0.5px;
        }
        /* Véritable Ardoise de Restaurant */
        .slate-container {
            width: 100%;
            height: 82%; 
            /* Texture ardoise naturelle noire/grise */
            background-color: #22252a;
            background-image: radial-gradient(rgba(255,255,255,0.03) 1px, transparent 0);
            background-size: 4px 4px;
            /* Cadre mouluré effet bois de chêne */
            border: 16px solid #4a3329; 
            border-radius: 8px;
            outline: 2px solid #2e1f18;
            box-shadow: 0 30px 50px rgba(0,0,0,0.8), inset 0 0 40px rgba(0,0,0,0.9);
            padding: 15px;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }
        .menu-photo {
            width: 100%;
            height: 100%;
            object-fit: contain; 
            filter: drop-shadow(0px 5px 15px rgba(0,0,0,0.5));
        }
    </style>
</head>
<body>

    <!-- GAUCHE : HORLOGE GLASSMORPHISM -->
    <div class="left-side">
        <div class="analog-clock" id="clock-face">
            <div class="hand hour-hand" id="hour"></div>
            <div class="hand minute-hand" id="minute"></div>
            <div class="hand second-hand" id="second"></div>
        </div>
    </div>

    <!-- DROITE : DATE RESTO + ARDOISE CHÊNE -->
    <div class="right-side">
        <div class="date-container">
            <div class="date-text" id="date">Chargement...</div>
        </div>
        <div class="slate-container">
            <img src="" id="menu-image" class="menu-photo" alt="Chargement du menu...">
        </div>
    </div>

    <script>
        // Génération des index de l'horloge
        const clockFace = document.getElementById('clock-face');
        for (let i = 1; i <= 12; i++) {
            const marker = document.createElement('div');
            marker.className = 'hour-marker';
            marker.style.transform = `rotate(${i * 30}deg) translateY(-152px)`;
            clockFace.appendChild(marker);
        }

        const photosSemaine = {
            1: "menu-lundi.jpg",
            2: "menu-mardi.jpg",
            3: "menu-mercredi.jpg",
            4: "menu-jeudi.jpg",
            5: "menu-vendredi.jpg"
        };
        const photoWeekend = "menu-ferme.jpg";

        function updateScreen() {
            const now = new Date();
            const dayOfWeek = now.getDay();
            
            // 1. Logique des aiguilles
            const seconds = now.getSeconds();
            const minutes = now.getMinutes();
            const hours = now.getHours();

            const secondDegrees = (seconds / 60) * 360;
            const minuteDegrees = (minutes / 60) * 360 + (seconds / 60) * 6;
            const hourDegrees = (hours / 12) * 360 + (minutes / 60) * 30;

            document.getElementById('second').style.transform = `rotate(${secondDegrees}deg)`;
            document.getElementById('minute').style.transform = `rotate(${minuteDegrees}deg)`;
            document.getElementById('hour').style.transform = `rotate(${hourDegrees}deg)`;

            // 2. Format de la date élégante
            const options = { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' };
            document.getElementById('date').textContent = now.toLocaleDateString('fr-FR', options);
            
            // 3. Liaison image menu
            const photoAujourdhui = photosSemaine[dayOfWeek] || photoWeekend;
            document.getElementById('menu-image').src = photoAujourdhui;
        }

        updateScreen();
        setInterval(updateScreen, 1000);
    </script>
</body>
</html>
