<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Affichage Dynamique École</title>
    <!-- Importation d'une police ultra-lisible à distance -->
    <link href="https://googleapis.com" rel="stylesheet">
    
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        
        body {
            font-family: 'Inter', sans-serif;
            width: 1920px;
            height: 1080px;
            overflow: hidden;
            background-color: #000000;
            background-size: cover;
            background-position: center;
            transition: background-image 0.5s ease-in-out;
        }

        /* Cadre de l'Horloge et de la Date (En haut à droite) */
        .clock-container {
            position: absolute;
            top: 60px;
            right: 60px;
            width: 550px;
            text-align: right;
            z-index: 10;
        }
        .time {
            font-size: 120px;
            font-weight: 900;
            color: #ffffff;
            line-height: 1;
            letter-spacing: -2px;
            text-shadow: 3px 3px 15px rgba(0,0,0,0.8);
        }
        .date {
            font-size: 34px;
            font-weight: 700;
            color: #00ffcc; /* Couleur turquoise pour faire ressortir la date */
            text-transform: capitalize;
            margin-top: 12px;
            text-shadow: 3px 3px 15px rgba(0,0,0,0.8);
        }

        /* Cadre d'affichage de la Photo du Menu (En bas à droite) */
        .menu-container {
            position: absolute;
            bottom: 60px;
            right: 60px;
            width: 550px;
            height: 680px; /* Zone optimisée pour accueillir l'affiche du menu */
            background: rgba(20, 20, 30, 0.85); /* Fond sombre semi-transparent */
            backdrop-filter: blur(12px); /* Effet de flou moderne sur le GIF de fond */
            border-radius: 28px;
            padding: 25px;
            border: 2px solid rgba(255, 255, 255, 0.12);
            box-shadow: 0 25px 50px rgba(0,0,0,0.7);
            display: flex;
            flex-direction: column;
        }
        .menu-title {
            font-size: 26px;
            font-weight: 900;
            color: #ff9f43; /* Couleur orange chaleureuse pour le restaurant */
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 20px;
            border-bottom: 2px solid rgba(255, 255, 255, 0.1);
            padding-bottom: 12px;
            text-align: center;
        }
        .menu-photo-wrapper {
            flex-grow: 1;
            width: 100%;
            height: calc(100% - 60px);
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            border-radius: 16px;
            background: #0d0d12;
        }
        .menu-photo {
            width: 100%;
            height: 100%;
            object-fit: contain; /* Ajuste la photo du menu sans jamais la déformer */
        }
    </style>
</head>
<body>

    <!-- Blocs automatiques gérés par le script -->
    <div class="clock-container">
        <div class="time" id="clock">00:00</div>
        <div class="date" id="date">Chargement...</div>
    </div>

    <div class="menu-container">
        <div class="menu-title">🍴 Au Menu Aujourd'hui</div>
        <div class="menu-photo-wrapper">
            <img src="" id="menu-image" class="menu-photo" alt="Chargement du menu...">
        </div>
    </div>

    <script>
        // ASSIGNATION AUTOMATIQUE DES IMAGES SELON LE JOUR
        // Veillez à nommer vos fichiers exactement comme ci-dessous sur GitHub
        const configSemaine = {
            1: { gif: "lundi.gif", photo: "menu-lundi.jpg" },
            2: { gif: "mardi.gif", photo: "menu-mardi.jpg" },
            3: { gif: "mercredi.gif", photo: "menu-mercredi.jpg" },
            4: { gif: "jeudi.gif", photo: "menu-jeudi.jpg" },
            5: { gif: "vendredi.gif", photo: "menu-vendredi.jpg" }
        };

        // Configuration de secours pour le week-end
        const configWeekend = { 
            gif: "weekend.gif", 
            photo: "menu-ferme.jpg" 
        };

        function updateScreen() {
            const now = new Date();
            const dayOfWeek = now.getDay(); // 1 = Lundi, 2 = Mardi...
            
            // 1. Horloge automatique (Heures:Minutes)
            let hours = String(now.getHours()).padStart(2, '0');
            let minutes = String(now.getMinutes()).padStart(2, '0');
            document.getElementById('clock').textContent = `${hours}:${minutes}`;
            
            // 2. Date automatique au format textuel français
            const options = { weekday: 'long', day: 'numeric', month: 'long' };
            document.getElementById('date').textContent = now.toLocaleDateString('fr-FR', options);
            
            // 3. Sélection des éléments du jour courant
            const dataJourdhui = configSemaine[dayOfWeek] || configWeekend;
            
            // Application du fond d'écran GIF correspondant
            document.body.style.backgroundImage = `url('${dataJourdhui.gif}')`;
            
            // Insertion de la photo du menu dans le cadre
            document.getElementById('menu-image').src = dataJourdhui.photo;
        }

        // Lancement immédiat au chargement de l'écran
        updateScreen();
        
        // Rafraîchissement automatique de l'heure toutes les secondes
        setInterval(updateScreen, 1000);
    </script>
</body>
</html>
