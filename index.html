<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Affichage Dynamique École</title>
    <link href="https://googleapis.com" rel="stylesheet">
    
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        
        body {
            font-family: 'Inter', sans-serif;
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            background-color: #000000;
            /* Ligne modifiée pour charger votre fichier menu.gif */
            background-image: url('menu.gif'); 
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            display: flex;
            padding: 4vh 4vw;
            justify-content: space-between;
            align-items: flex-end; /* Laisse le haut de l'écran libre pour le titre de votre GIF */
        }

        /* --- MOITIÉ GAUCHE : HORLOGE ANALOGIQUE COMPACTE --- */
        .left-side {
            width: 45%;
            height: 70vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .analog-clock {
            width: 320px; 
            height: 320px;
            border: 10px solid #ffffff;
            border-radius: 50%;
            position: relative;
            background: #111b29;
            box-shadow: 0 15px 30px rgba(0,0,0,0.6), inset 0 0 20px rgba(0,0,0,0.6);
        }
        .analog-clock::after {
            content: '';
            position: absolute;
            width: 14px;
            height: 14px;
            background: #ff9f43;
            border-radius: 50%;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 10;
        }
        .hour-marker {
            position: absolute;
            width: 4px;
            height: 12px;
            background: #ffffff;
            left: 50%;
            margin-left: -2px;
            transform-origin: bottom center;
            bottom: 50%;
        }
        .hand {
            position: absolute;
            bottom: 50%;
            left: 50%;
            transform-origin: bottom center;
            border-radius: 6px;
        }
        .hour-hand {
            width: 8px;
            height: 80px;
            background: #ffffff;
            z-index: 5;
            margin-left: -4px;
        }
        .minute-hand {
            width: 5px;
            height: 115px;
            background: #ffffff;
            z-index: 6;
            margin-left: -2.5px;
        }
        .second-hand {
            width: 2px;
            height: 130px;
            background: #ff9f43;
            z-index: 7;
            margin-left: -1px;
        }

        /* --- MOITIÉ DROITE : DATE ET ARDOISE PROPORTIONNELLES --- */
        .right-side {
            width: 45%;
            height: 70vh; 
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }
        .date-container {
            width: 100%;
            background: #111b29;
            border-radius: 16px;
            padding: 15px;
            text-align: center;
            border: 2px solid rgba(255, 255, 255, 0.15);
            box-shadow: 0 10px 20px rgba(0,0,0,0.5);
        }
        .date-text {
            font-size: 24px; 
            font-weight: 700;
            color: #00ffcc;
            text-transform: capitalize;
        }
        .slate-container {
            width: 100%;
            height: 80%; 
            background: #1e1e1e; 
            border: 15px solid #5c4033; 
            border-radius: 12px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.7), inset 0 0 20px rgba(0,0,0,1);
            padding: 10px;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }
        .menu-photo {
            width: 100%;
            height: 100%;
            object-fit: contain; 
        }
    </style>
</head>
<body>

    <!-- GAUCHE : HORLOGE -->
    <div class="left-side">
        <div class="analog-clock" id="clock-face">
            <div class="hand hour-hand" id="hour"></div>
            <div class="hand minute-hand" id="minute"></div>
            <div class="hand second-hand" id="second"></div>
        </div>
    </div>

    <!-- DROITE : DATE + ARDOISE -->
    <div class="right-side">
        <div class="date-container">
            <div class="date-text" id="date">Chargement...</div>
        </div>
        <div class="slate-container">
            <img src="" id="menu-image" class="menu-photo" alt="Chargement du menu...">
        </div>
    </div>

    <script>
        // Génération des 12 repères
        const clockFace = document.getElementById('clock-face');
        for (let i = 1; i <= 12; i++) {
            const marker = document.createElement('div');
            marker.className = 'hour-marker';
            marker.style.transform = `rotate(${i * 30}deg) translateY(-138px)`;
            clockFace.appendChild(marker);
        }

        const photosSemaine = {
            1: "menu-lundi.jpg",
            2: "menu-mardi.jpg",
            3: "menu-mercredi.jpg",
            4: "menu-jeudi.jpg",
            5: "menu-vendredi.jpg"
        };
        const photoWeekend = "menu-ferme.jpg";

        function updateScreen() {
            const now = new Date();
            const dayOfWeek = now.getDay();
            
            // 1. Aiguilles Horloge
            const seconds = now.getSeconds();
            const minutes = now.getMinutes();
            const hours = now.getHours();

            const secondDegrees = (seconds / 60) * 360;
            const minuteDegrees = (minutes / 60) * 360 + (seconds / 60) * 6;
            const hourDegrees = (hours / 12) * 360 + (minutes / 60) * 30;

            document.getElementById('second').style.transform = `rotate(${secondDegrees}deg)`;
            document.getElementById('minute').style.transform = `rotate(${minuteDegrees}deg)`;
            document.getElementById('hour').style.transform = `rotate(${hourDegrees}deg)`;

            // 2. Date
            const options = { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' };
            document.getElementById('date').textContent = now.toLocaleDateString('fr-FR', options);
            
            // 3. Photo du menu
            const photoAujourdhui = photosSemaine[dayOfWeek] || photoWeekend;
            document.getElementById('menu-image').src = photoAujourdhui;
        }

        updateScreen();
        setInterval(updateScreen, 1000);
    </script>
</body>
</html>
