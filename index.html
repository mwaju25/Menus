<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Affichage École</title>
    <link href="https://googleapis.com" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Inter', sans-serif; width: 100vw; height: 100vh; overflow: hidden;
            background: #000 url('menu.gif') center/cover no-repeat;
            display: flex; padding: 4vh 6vw; justify-content: space-between; align-items: flex-end; 
        }
        .left-side, .right-side { width: 44%; height: 62vh; display: flex; }
        .left-side { justify-content: center; align-items: center; }
        .right-side { flex-direction: column; justify-content: space-between; }

        /* --- HORLOGE ENGRENAGES NOIR & OR --- */
        .analog-clock {
            width: 380px; height: 380px; border: 8px solid #222; border-radius: 50%;
            position: relative; background: #111; overflow: hidden;
            box-shadow: 0 30px 60px rgba(0,0,0,0.8), inset 0 0 40px rgba(0,0,0,0.9);
        }
        .gear-container { position: absolute; width: 100%; height: 100%; opacity: 0.45; z-index: 1; }
        .gear-main {
            position: absolute; top: 50%; left: 50%; width: 130px; height: 130px; margin: -65px 0 0 -65px;
            border: 6px dashed #d4af37; border-radius: 50%; animation: rot 50s linear infinite;
        }
        .gear-second {
            position: absolute; top: 36%; left: 36%; width: 80px; height: 80px;
            border: 4px dashed #aa8416; border-radius: 50%; animation: rotRev 25s linear infinite;
        }
        @keyframes rot { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
        @keyframes rotRev { from { transform: rotate(0deg); } to { transform: rotate(-360deg); } }

        .clock-face-lines { position: absolute; width: 100%; height: 100%; z-index: 3; }
        .analog-clock::after {
            content: ''; position: absolute; width: 14px; height: 14px; background: #d4af37;
            border-radius: 50%; top: 50%; left: 50%; transform: translate(-50%, -50%); z-index: 10;
        }
        .clock-number {
            position: absolute; font-family: 'Playfair Display', serif; font-size: 34px;
            font-weight: 900; color: #d4af37; width: 40px; height: 40px; text-align: center; line-height: 40px;
        }
        .hour-marker {
            position: absolute; width: 2px; height: 12px; background: rgba(255, 255, 255, 0.4);
            left: 50%; margin-left: -1px; transform-origin: bottom center; bottom: 50%;
        }
        .hand { position: absolute; bottom: 50%; left: 50%; transform-origin: bottom center; border-radius: 4px; }
        .hour-hand { width: 8px; height: 90px; background: #fff; z-index: 5; margin-left: -4px; }
        .minute-hand { width: 5px; height: 135px; background: #fff; z-index: 6; margin-left: -2.5px; }
        .second-hand { width: 2px; height: 155px; background: #d4af37; z-index: 7; margin-left: -1px; }

        /* --- GRANDE DATE & ARDOISE --- */
        .date-container {
            width: 100%; background: rgba(17, 17, 17, 0.95); border-radius: 20px;
            padding: 22px; text-align: center; border: 3px solid #d4af37; box-shadow: 0 20px 40px rgba(0,0,0,0.8);
        }
        .date-text { font-size: 36px; font-weight: 900; color: #fff; text-transform: uppercase; letter-spacing: 1px; }
        .slate-container {
            width: 100%; height: 74%; background: #1e1e1e; border: 18px solid #4a3329; border-radius: 10px;
            outline: 2px solid #2e1f18; box-shadow: 0 25px 50px rgba(0,0,0,0.7), inset 0 0 30px rgba(0,0,0,0.9);
            padding: 10px; display: flex; justify-content: center; align-items: center; overflow: hidden;
        }
        .menu-photo { width: 100%; height: 100%; object-fit: contain; }
    </style>
</head>
<body>

    <div class="left-side">
        <div class="analog-clock">
            <div class="gear-container"><div class="gear-main"></div><div class="gear-second"></div></div>
            <div class="clock-face-lines" id="clock-face">
                <div class="hand hour-hand" id="hour"></div>
                <div class="hand minute-hand" id="minute"></div>
                <div class="hand second-hand" id="second"></div>
            </div>
        </div>
    </div>

    <div class="right-side">
        <div class="date-container"><div class="date-text" id="date">Chargement...</div></div>
        <div class="slate-container"><img src="" id="menu-image" class="menu-photo" alt="Menu"></div>
    </div>

    <script>
        const clockFace = document.getElementById('clock-face');
        for (let i = 1; i <= 12; i++) {
            const num = document.createElement('div');
            num.className = 'clock-number'; num.textContent = i;
            const angle = (i * 30 - 90) * (Math.PI / 180);
            num.style.left = `${190 + 145 * Math.cos(angle) - 20}px`;
            num.style.top = `${190 + 145 * Math.sin(angle) - 20}px`;
            clockFace.appendChild(num);
        }
        for (let i = 1; i <= 60; i++) {
            if (i % 5 !== 0) {
                const m = document.createElement('div'); m.className = 'hour-marker';
                m.style.transform = `rotate(${i * 6}deg) translateY(-172px)`; clockFace.appendChild(m);
            }
        }

        const photosSemaine = { 1: "menu-lundi.jpg", 2: "menu-mardi.jpg", 3: "menu-mercredi.jpg", 4: "menu-jeudi.jpg", 5: "menu-vendredi.jpg" };

        function update() {
            const now = new Date();
            document.getElementById('second').style.transform = `rotate(${(now.getSeconds() / 60) * 360}deg)`;
            document.getElementById('minute').style.transform = `rotate(${(now.getMinutes() / 60) * 360 + (now.getSeconds() / 60) * 6}deg)`;
            document.getElementById('hour').style.transform = `rotate(${(now.getHours() / 12) * 360 + (now.getMinutes() / 60) * 30}deg)`;
            document.getElementById('date').textContent = now.toLocaleDateString('fr-FR', { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' });
            
            const photo = photosSemaine[now.getDay()] || "menu-ferme.jpg";
            if (!document.getElementById('menu-image').src.includes(photo)) document.getElementById('menu-image').src = photo;
        }
        update(); setInterval(update, 1000);
    </script>
</body>
</html>
