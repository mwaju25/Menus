var days=['dimanche','lundi','mardi','mercredi','jeudi','vendredi','samedi'];
var months=['janvier','février','mars','avril','mai','juin','juillet','août','septembre','octobre','novembre','décembre'];
var seasons2026={
 spring:new Date('2026-03-20T15:46:00+01:00'),
 summer:new Date('2026-06-21T10:25:00+02:00'),
 autumn:new Date('2026-09-23T02:05:00+02:00'),
 winter:new Date('2026-12-21T21:50:00+01:00')
};
function seasonFor(d){
 var m=d.getMonth()+1,day=d.getDate();
 if((m===12&&day>=15)||(m===1&&day<=5))return 'festive';
 var y=d.getFullYear();
 if(y===2026){if(d<seasons2026.spring)return 'winter';if(d<seasons2026.summer)return 'spring';if(d<seasons2026.autumn)return 'summer';if(d<seasons2026.winter)return 'autumn';return 'winter';}
 var spring=new Date(y+'-03-20T00:00:00'),summer=new Date(y+'-06-21T00:00:00'),autumn=new Date(y+'-09-22T00:00:00'),winter=new Date(y+'-12-21T00:00:00');
 if(d<spring)return 'winter';if(d<summer)return 'spring';if(d<autumn)return 'summer';if(d<winter)return 'autumn';return 'winter';
}
function two(n){return n<10?'0'+n:String(n)}
function keyOf(d){return d.getFullYear()+'-'+two(d.getMonth()+1)+'-'+two(d.getDate())}
function renderDate(d){document.getElementById('date').textContent=`${days[d.getDay()]} ${d.getDate()} ${months[d.getMonth()]} ${d.getFullYear()}`}
function section(title,items){var h='<div class="section-block"><div class="section-title">'+title+'</div>';for(var i=0;i<items.length;i++)h+='<div class="item">'+items[i]+'</div>';return h+'</div>'}
function renderMenu(d){
 var box=document.getElementById('menu'),m=MENUS[keyOf(d)];
 if(!m){box.innerHTML='<div class="empty">Menu non communiqué</div>';return}
 if(m.special){box.innerHTML='<div class="empty">Plat du jour</div>';return}
 var h='';
 if(m.entree)h+=section('Entrée',[m.entree]);
 if(m.plat)h+='<div class="sep">✦</div>'+section('Plat',m.plat);
 if(m.dessert)h+='<div class="sep">✦</div>'+section('Dessert',[m.dessert]);
 box.innerHTML=h;
}
function drawClock(){
 var wrap=document.getElementById('clock'),c=document.getElementById('clockCanvas');
 var r=wrap.getBoundingClientRect(),dpr=window.devicePixelRatio||1;
 c.width=Math.round(r.width*dpr);c.height=Math.round(r.height*dpr);
 var x=c.getContext('2d');x.setTransform(dpr,0,0,dpr,0,0);
 var w=r.width,h=r.height,cx=w/2,cy=h/2;
 var rx=w*.500, ry=h*.500;
 x.clearRect(0,0,w,h);
 x.save();
 x.translate(cx,cy);
 x.scale(rx,ry);

 /* =========================================================
    CADRAN V36 — position et taille STRICTEMENT celles de V34.
    Le disque dynamique couvre toute la zone intérieure et
    recouvre les 4 repères du fond.
    ========================================================= */
 var face=x.createRadialGradient(-.18,-.20,.05,0,0,1.02);
 face.addColorStop(0,'#2b2117');
 face.addColorStop(.48,'#211810');
 face.addColorStop(1,'#120d09');
 x.beginPath();x.arc(0,0,1,0,Math.PI*2);x.fillStyle=face;x.fill();

 /* Contour doré intégré au cadran, sans changer sa position. */
 x.beginPath();x.arc(0,0,.988,0,Math.PI*2);
 x.strokeStyle='#c9922e';x.lineWidth=.028;x.stroke();
 x.beginPath();x.arc(0,0,.958,0,Math.PI*2);
 x.strokeStyle='rgba(247,202,96,.72)';x.lineWidth=.009;x.stroke();

 /* Graduations fines, identiques dans leur logique à la référence. */
 for(var i=0;i<60;i++){
   var a=i*Math.PI/30-Math.PI/2;
   var major=i%5===0;
   var r1=.925, r2=major ? .845 : .895;
   x.beginPath();
   x.moveTo(Math.cos(a)*r1,Math.sin(a)*r1);
   x.lineTo(Math.cos(a)*r2,Math.sin(a)*r2);
   x.strokeStyle=major?'#f6f3ea':'rgba(245,242,235,.72)';
   x.lineWidth=major ? .014 : .0055;
   x.lineCap='butt';x.stroke();
 }

 /* Chiffres : Times New Roman, blanc, gras, placement circulaire de la référence. */
 x.textAlign='center';x.textBaseline='middle';x.fillStyle='#f7f4ec';
 x.font='700 .108px "Times New Roman",Times,serif';
 for(var n=1;n<=12;n++){
   var a=n*Math.PI/6-Math.PI/2,rr=.765;
   x.fillText(String(n),Math.cos(a)*rr,Math.sin(a)*rr);
 }

 var now=new Date();

 /* HEURE RÉELLE — Belgique / Europe-Brussels.
    On lit séparément heure, minute et seconde dans le fuseau belge.
    Les angles sont ensuite calculés selon une vraie horloge analogique :
      - seconde : 6° par seconde
      - minute : 6° par minute + fraction de seconde
      - heure   : 30° par heure + fraction de minute

   second:'2-digit'

 var min=t.minute+sec/60;

 function drawHand(angle,len,width,color,tail=0.055){
   var a=angle*Math.PI/6-Math.PI/2;
   var ux=Math.cos(a),uy=Math.sin(a),vx=-uy,vy=ux;
   var tipX=ux*len,tipY=uy*len;
   var backX=-ux*tail,backY=-uy*tail;
   var half=width/2;
   x.beginPath();
   x.moveTo(backX+vx*half,backY+vy*half);
   x.lineTo(tipX+vx*half*.55,tipY+vy*half*.55);
   x.lineTo(tipX,tipY);
   x.lineTo(tipX-vx*half*.55,tipY-vy*half*.55);
   x.lineTo(backX-vx*half,backY-vy*half);
   x.closePath();
   x.fillStyle=color;x.shadowColor='rgba(0,0,0,.72)';x.shadowBlur=.018;x.fill();
   x.shadowBlur=0;
 }
 drawHand(hr,.47,.055,'#e5b247',.075);       // heure
 drawHand(min/5,.73,.035,'#f0c45a',.065);    // minute : 6° par minute

 /* Seconde : fine, longue, avec petit contrepoids. */
 var a=sec*Math.PI/30-Math.PI/2,ux=Math.cos(a),uy=Math.sin(a);
 x.beginPath();x.moveTo(-ux*.13,-uy*.13);x.lineTo(ux*.86,uy*.86);
 x.strokeStyle='#d3a23b';x.lineWidth=.009;x.lineCap='round';x.stroke();

 /* Axe central doré. */
 x.beginPath();x.arc(0,0,.060,0,Math.PI*2);x.fillStyle='#dca63d';x.fill();
 x.beginPath();x.arc(0,0,.024,0,Math.PI*2);x.fillStyle='#fff0c6';x.fill();
 x.restore();
}
function render(){
 var now=new Date(),season=seasonFor(now),bg=document.getElementById('background');
 if(bg.dataset.season!==season){bg.src=BG[season];bg.dataset.season=season;}
 renderDate(now);renderMenu(now);drawClock();
}
render();setInterval(render,1000);addEventListener('resize',drawClock);
</script>
