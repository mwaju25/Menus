<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>MENU DU JOUR - PRIMAIRE</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#000}
body{font-family:Georgia,"Times New Roman",serif}
#screen{position:relative;width:100vw;height:100vh;overflow:hidden;background:#000}
#background{position:absolute;inset:0;width:100%;height:100%;display:block;z-index:0}
#clock{position:absolute;left:9.9%;top:23.2%;width:24.9%;aspect-ratio:1;z-index:2;pointer-events:none}
#clock canvas{width:100%;height:100%;display:block}
#date{position:absolute;left:47.2%;top:17.5%;width:40.8%;height:8.5%;z-index:2;display:flex;align-items:center;justify-content:center;color:#fff;font-family:Georgia,"Times New Roman",serif;font-weight:700;font-size:clamp(17px,1.75vw,33px);line-height:1;text-align:center;text-transform:uppercase;text-shadow:0 2px 4px #000;white-space:nowrap}
#menu{position:absolute;left:47.0%;top:29.3%;width:41.0%;height:55.5%;z-index:2;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;color:#fff;font-family:Georgia,"Times New Roman",serif;text-shadow:0 2px 4px #000;overflow:hidden;padding:1% 3%}
.section{color:#e9bd5b;font-weight:700;font-size:clamp(17px,1.45vw,28px);line-height:1.1;margin:.8vh 0 .35vh;letter-spacing:.035em}
.item{font-family:Georgia,"Times New Roman",serif;font-size:clamp(17px,1.52vw,29px);line-height:1.25;margin:.05vh 0;color:#fff}
.sep{color:#d6a63e;font-size:clamp(12px,.95vw,18px);line-height:1;margin:.45vh 0}
.empty{color:#efbd54;font-family:Georgia,"Times New Roman",serif;font-size:clamp(20px,2vw,38px);font-weight:700}
@media(max-aspect-ratio:1.45){#clock{left:9%;width:27%}#date{left:46%;width:42%;font-size:clamp(18px,2.1vw,34px)}#menu{left:45.7%;width:42.5%}}
</style></head>
<body><div id="screen"><img id="background" alt="" src="">
<div id="clock"><canvas id="clockCanvas"></canvas></div><div id="date"></div><div id="menu"></div></div>
<script>
const MENUS={
"2026-09-03":{entree:"Potage",plat:["Roti de dinde","Potée de chou fleur"],dessert:"Dessert maison"},
"2026-09-04":{entree:"Potage",plat:["Pâtes","sauce bolognaise"],dessert:"Dessert du jour"},
"2026-09-07":{entree:"Potage",plat:["Pain de viande","Sauce tomate","Frites"],dessert:"Fruit de saison"},
"2026-09-08":{entree:"Potage",plat:["Pdt rissolées","Omelettes aux légumes","(végétarien)"],dessert:"Yaourt"},
"2026-09-09":{special:"Plat du jour"},
"2026-09-10":{entree:"Potage",plat:["Riz sauté au poulet"],dessert:"Dessert maison"},
"2026-09-11":{entree:"Potage",plat:["Pâtes au fromage et jambon"],dessert:"Dessert du jour"},
"2026-09-14":{entree:"Potage",plat:["Gyros de porc","Frites"],dessert:"Fruit de saison"},
"2026-09-15":{entree:"Potage",plat:["Gratin pdt brocoli","Escalope de poulet"],dessert:"Crème caramel"},
"2026-09-16":{special:"Plat du jour"},
"2026-09-17":{entree:"Potage",plat:["Hamburger maison","(végétarien)"],dessert:"Dessert maison"},
"2026-09-18":{entree:"Potage",plat:["Pâtes","Sauce tomate"],dessert:"Dessert du jour"},
"2026-09-21":{entree:"Potage",plat:["Vol-au-vent","Frites"],dessert:"Fruit de saison"},
"2026-09-22":{entree:"Potage",plat:["Pâtes carbonara"],dessert:"Yaourt"},
"2026-09-23":{special:"Plat du jour"},
"2026-09-24":{entree:"Potage",plat:["Roti porc","PDT, haricots verts","Sauce tomates"],dessert:"Dessert maison"},
"2026-09-25":{entree:"Potage",plat:["Pâtes au pesto vert","(végétarien)"],dessert:"Dessert du jour"},
"2026-09-28":{entree:"Potage",plat:["Roulades de boeuf","Champignons crème","Frites"],dessert:"Fruit de saison"},
"2026-09-29":{entree:"Potage",plat:["Pâtes aux scampis","Petits légumes"],dessert:"Crème caramel"},
"2026-09-30":{special:"Plat du jour"},
"2026-10-01":{entree:"Potage",plat:["Potée liégeoise","Lard"],dessert:"Dessert maison"},
"2026-10-02":{entree:"Potage",plat:["Pâtes au gratin","(végétarien)"],dessert:"Dessert du jour"}
};
const BG={spring:"fonds/printemps.jpg",summer:"fonds/ete.jpg",autumn:"fonds/automne.jpg",winter:"fonds/hiver.jpg",festive:"fonds/fetes.jpg"};
const days=["dimanche","lundi","mardi","mercredi","jeudi","vendredi","samedi"],months=["janvier","février","mars","avril","mai","juin","juillet","août","septembre","octobre","novembre","décembre"];
function seasonFor(d){const m=d.getMonth()+1,day=d.getDate();if((m===12&&day>=15)||(m===1&&day<=5))return"festive";const y=d.getFullYear();const spring=new Date(`${y}-03-20T15:46:00+01:00`),summer=new Date(`${y}-06-21T10:25:00+02:00`),autumn=new Date(`${y}-09-23T02:05:00+02:00`),winter=new Date(`${y}-12-21T21:50:00+01:00`);if(d<spring)return"winter";if(d<summer)return"spring";if(d<autumn)return"summer";if(d<winter)return"autumn";return"winter"}
function keyOf(d){return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`}
function renderDate(d){document.getElementById('date').textContent=`${days[d.getDay()]} ${d.getDate()} ${months[d.getMonth()]} ${d.getFullYear()}`}
function renderMenu(d){const box=document.getElementById('menu'),m=MENUS[keyOf(d)];if(!m){box.innerHTML='<div class="empty">Menu non communiqué</div>';return}if(m.special){box.innerHTML='<div class="empty">Plat du jour</div>';return}let h='';if(m.entree)h+=`<div class="section">— ENTRÉE —</div><div class="item">${m.entree}</div><div class="sep">✦</div>`;h+='<div class="section">— PLAT —</div>';m.plat.forEach(x=>h+=`<div class="item">${x}</div>`);if(m.dessert)h+=`<div class="sep">✦</div><div class="section">— DESSERT —</div><div class="item">${m.dessert}</div>`;box.innerHTML=h}
function drawClock(){const wrap=document.getElementById('clock'),c=document.getElementById('clockCanvas'),r=wrap.getBoundingClientRect(),dpr=devicePixelRatio||1;c.width=Math.round(r.width*dpr);c.height=Math.round(r.height*dpr);const x=c.getContext('2d');x.setTransform(dpr,0,0,dpr,0,0);const w=r.width,h=r.height,R=Math.min(w,h)/2;x.clearRect(0,0,w,h);x.save();x.translate(w/2,h/2);for(let i=0;i<60;i++){const a=i*Math.PI/30-Math.PI/2,major=i%5===0,ri=R*.84,ro=R*(major?.76:.80);x.beginPath();x.moveTo(Math.cos(a)*ro,Math.sin(a)*ro);x.lineTo(Math.cos(a)*ri,Math.sin(a)*ri);x.strokeStyle=major?'rgba(247,240,223,.95)':'rgba(239,225,196,.78)';x.lineWidth=major?Math.max(1.5,R*.013):Math.max(.8,R*.006);x.stroke()}x.textAlign='center';x.textBaseline='middle';x.fillStyle='#f8f1df';x.font=`700 ${Math.max(15,R*.105)}px Georgia,"Times New Roman",serif`;for(let n=1;n<=12;n++){const a=n*Math.PI/6-Math.PI/2,rr=R*.68;x.fillText(n,Math.cos(a)*rr,Math.sin(a)*rr)}const now=new Date(),sec=now.getSeconds()+now.getMilliseconds()/1000,min=now.getMinutes()+sec/60,hr=(now.getHours()%12)+min/60;function hand(v,unit,len,width,color){x.save();x.rotate(v*unit-Math.PI/2);x.beginPath();x.moveTo(-len*.14,0);x.lineTo(len,0);x.strokeStyle=color;x.lineWidth=width;x.lineCap='round';x.shadowColor='rgba(0,0,0,.8)';x.shadowBlur=3;x.stroke();x.restore()}hand(hr,Math.PI/6,R*.46,Math.max(3,R*.033),'#f1c45d');hand(min,Math.PI/30,R*.68,Math.max(2,R*.020),'#f5cf6a');hand(sec,Math.PI/30,R*.77,Math.max(1,R*.006),'#dca83d');x.beginPath();x.arc(0,0,R*.052,0,Math.PI*2);x.fillStyle='#dba63e';x.fill();x.beginPath();x.arc(0,0,R*.019,0,Math.PI*2);x.fillStyle='#fff1c9';x.fill();x.restore()}
function render(){const now=new Date();document.getElementById('background').src=BG[seasonFor(now)];renderDate(now);renderMenu(now);drawClock()}render();setInterval(render,1000);addEventListener('resize',drawClock);
</script></body></html>
